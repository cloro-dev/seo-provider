name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The oldest Node line that engines allows (>=22.19.0) and the current
    # LTS line.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:check
      - run: npm pack --dry-run
